[workspace]
resolver = "2"

members = [
    "batcher",
]

[workspace.package]
version = "2.2.0"
rust-version = "1.92"

[workspace.dependencies]
soroban-sdk = { version = "=29.0.1" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
