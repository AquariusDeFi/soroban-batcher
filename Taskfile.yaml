version: '3'

tasks:
  default:
    cmds:
      - task: build

  all:
    cmds:
      - task: clean
      - task: fmt
      - task: build
      - task: test

  build:
    cmds:
      - stellar contract build --package soroban-batcher --optimize
      - ls -l target/wasm32v1-none/release/*.wasm

  test:
    cmd: cargo test

  check:
    cmd: cargo check --all

  fmt:
    cmd: cargo fmt --all

  clean:
    cmd: cargo clean
